<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Klondike Solitaire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,600;0,900;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* WebKit等でポインタが消失しない安全な標準カーソル指定 */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #0f3d24;
      background-image: radial-gradient(circle at 50% 30%, #165330 0%, #0d331e 75%, #082414 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: default !important;
    }

    button, a, .clickable {
      cursor: pointer !important;
    }

    .font-card {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .card-slot {
      aspect-ratio: 2.5 / 3.5;
      border-radius: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      position: relative;
      background: rgba(0, 0, 0, 0.15);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    /* トランプカード本体 */
    .playing-card {
      aspect-ratio: 2.5 / 3.5;
      border-radius: 7px;
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0,0,0,0.2);
    }

    .playing-card[draggable="true"] {
      cursor: grab !important;
    }
    .playing-card:active {
      cursor: grabbing !important;
    }

    .playing-card.dragging {
      opacity: 0.9;
      transform: scale(1.04);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6) !important;
      z-index: 9999 !important;
    }

    /* 表面（白地・高級感のあるアイボリー） */
    .card-front {
      background: linear-gradient(135deg, #ffffff 0%, #fbfbfa 60%, #f4f3ef 100%);
      border: 1px solid #dcdad5;
    }

    /* 裏面（Apps Hubキューブメダリオン） */
    .card-back {
      background: #1e3a8a;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      overflow: hidden;
      cursor: default !important;
    }
    .card-back-pattern {
      width: 100%;
      height: 100%;
      background-image: 
        repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 8px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.08) 0, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .suit-red { color: #dc2626; fill: #dc2626; }
    .suit-black { color: #1e293b; fill: #1e293b; }

    /* ヒント枠 */
    .hint-source {
      box-shadow: 0 0 0 3px #facc15, 0 0 18px rgba(250, 204, 21, 0.8) !important;
      z-index: 50 !important;
    }
    .hint-target {
      box-shadow: 0 0 0 3px #38bdf8, 0 0 18px rgba(56, 189, 248, 0.8) !important;
      z-index: 50 !important;
    }

    /* トランプのピップ配置グリッド */
    .pips-grid {
      position: absolute;
      inset: 18% 14%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      justify-items: center;
      pointer-events: none;
    }
    .pip {
      font-size: clamp(12px, 1.8vw, 18px);
      line-height: 1;
    }
    .pip.rotate {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-black/35 backdrop-blur-md border-b border-white/10 px-4 py-2.5 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="../" class="text-xs font-bold text-white/70 hover:text-white bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> Apps Hub
        </a>
        <h1 class="text-sm font-bold text-white flex items-center gap-1.5 font-card tracking-wider">
          <i class="fa-solid fa-clone text-rose-400"></i> KLONDIKE
        </h1>
      </div>
      <div class="flex items-center gap-3 text-xs font-mono">
        <div class="bg-black/40 px-3 py-1 rounded-md border border-white/10 shadow-inner">
          <span class="text-white/60">TIME:</span> <span id="time-display" class="font-bold text-white">00:00</span>
        </div>
        <div class="bg-black/40 px-3 py-1 rounded-md border border-white/10 shadow-inner">
          <span class="text-white/60">SCORE:</span> <span id="score-display" class="font-bold text-amber-300">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="max-w-4xl mx-auto w-full px-3 py-2 flex items-center justify-between gap-2 text-xs">
    <div class="flex gap-2">
      <button onclick="newGame()" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg border border-white/20 transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-rotate-right"></i> 配り直す
      </button>
      <button onclick="showHint()" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg border border-white/20 transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-regular fa-lightbulb text-amber-300"></i> ヒント
      </button>
      <button onclick="undoMove()" id="btn-undo" disabled class="bg-white/10 text-white/40 font-bold px-3 py-1.5 rounded-lg border border-white/10 transition flex items-center gap-1.5 disabled:opacity-40">
        <i class="fa-solid fa-arrow-rotate-left"></i> 待った
      </button>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleSound()" id="sound-btn" class="bg-white/15 hover:bg-white/25 text-white font-bold p-1.5 px-2.5 rounded-lg border border-white/20 transition">
        <i id="sound-icon" class="fa-solid fa-volume-high"></i>
      </button>
    </div>
  </div>

  <!-- Game Board -->
  <main class="max-w-4xl mx-auto w-full px-2 sm:px-4 py-3 flex-1 flex flex-col justify-start">
    
    <!-- Top Row: Stock / Waste / Spacer / Foundations -->
    <div class="grid grid-cols-7 gap-2 sm:gap-3 mb-6">
      
      <!-- 1: Stock (山札) -->
      <div id="stock-slot" onclick="drawStock()" class="card-slot flex items-center justify-center cursor-pointer hover:border-white/40 transition">
        <i class="fa-solid fa-rotate-left text-white/30 text-xl"></i>
      </div>

      <!-- 2: Waste (捨て札) -->
      <div id="waste-slot" class="card-slot"></div>

      <!-- 3: Spacer -->
      <div class="pointer-events-none"></div>

      <!-- 4-7: Foundations (組札 ♠ ♥ ♦ ♣) -->
      <div id="foundation-0" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 0)" class="card-slot flex items-center justify-center">
        <span class="text-white/20 text-3xl font-bold">♠</span>
      </div>
      <div id="foundation-1" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 1)" class="card-slot flex items-center justify-center">
        <span class="text-rose-400/25 text-3xl font-bold">♥</span>
      </div>
      <div id="foundation-2" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 2)" class="card-slot flex items-center justify-center">
        <span class="text-rose-400/25 text-3xl font-bold">♦</span>
      </div>
      <div id="foundation-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 3)" class="card-slot flex items-center justify-center">
        <span class="text-white/20 text-3xl font-bold">♣</span>
      </div>

    </div>

    <!-- Bottom Row: 7 Tableaus (場札) -->
    <div class="grid grid-cols-7 gap-2 sm:gap-3 flex-1 min-h-[420px]">
      <div id="tableau-0" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 0)" class="card-slot"></div>
      <div id="tableau-1" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 1)" class="card-slot"></div>
      <div id="tableau-2" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 2)" class="card-slot"></div>
      <div id="tableau-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 3)" class="card-slot"></div>
      <div id="tableau-4" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 4)" class="card-slot"></div>
      <div id="tableau-5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 5)" class="card-slot"></div>
      <div id="tableau-6" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 6)" class="card-slot"></div>
    </div>

  </main>

  <!-- Clear Modal -->
  <div id="win-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex-col items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-700 p-6 sm:p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl relative">
      <div class="w-16 h-16 rounded-2xl bg-amber-400/20 text-amber-400 flex items-center justify-center text-3xl mx-auto mb-4 border border-amber-400/30">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 class="text-2xl font-black text-white mb-1 font-card">CONGRATULATIONS!</h2>
      <p class="text-sm text-slate-400 mb-6">見事にクロンダイクをクリアしました！</p>
      <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 mb-6 text-xs flex justify-around font-mono">
        <div><span class="text-slate-400">TIME:</span> <span id="win-time" class="font-bold text-white">00:00</span></div>
        <div><span class="text-slate-400">SCORE:</span> <span id="win-score" class="font-bold text-amber-300">0</span></div>
      </div>
      <button onclick="newGame()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-white shadow-lg transition active:scale-95">
        もう一度遊ぶ
      </button>
    </div>
  </div>

  <footer class="py-3 text-center text-[11px] text-white/40">
    ※個人開発プロトタイプにつき無保証・自己責任にてご利用ください（Apps Hub）
  </footer>

  <script>
    const SUITS = ['spade', 'heart', 'diamond', 'club'];
    const SUIT_ICONS = { spade: '♠', heart: '♥', diamond: '♦', club: '♣' };
    const SUIT_COLORS = { spade: 'black', heart: 'red', diamond: 'red', club: 'black' };
    const RANK_LABELS = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };

    let stock = [];
    let waste = [];
    let foundations = [[], [], [], []];
    let tableaus = [[], [], [], [], [], [], []];
    let moveHistory = [];

    let score = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let soundEnabled = true;
    let isAutoCompleting = false;

    // Web Audio Synthesizer
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const actx = getAudioCtx();
        const now = actx.currentTime;
        const osc = actx.createOscillator();
        const gain = actx.createGain();

        if (type === 'deal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'place') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.07);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(now); osc.stop(now + 0.07);
        } else if (type === 'foundation') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(now); osc.stop(now + 0.12);
        }
      } catch (e) {}
    }

    function createDeck() {
      const deck = [];
      SUITS.forEach(suit => {
        for (let r = 1; r <= 13; r++) {
          deck.push({
            suit: suit,
            rank: r,
            faceUp: false,
            color: SUIT_COLORS[suit]
          });
        }
      });
      // Fisher-Yates シャッフル
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function newGame() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      score = 0;
      moveHistory = [];
      isAutoCompleting = false;
      document.getElementById('win-modal').classList.add('hidden');
      document.getElementById('btn-undo').disabled = true;

      const deck = createDeck();
      stock = [];
      waste = [];
      foundations = [[], [], [], []];
      tableaus = [[], [], [], [], [], [], []];

      for (let i = 0; i < 7; i++) {
        for (let j = 0; j <= i; j++) {
          const card = deck.pop();
          if (j === i) card.faceUp = true;
          tableaus[i].push(card);
        }
      }

      stock = deck;

      timerInterval = setInterval(() => {
        timerSeconds++;
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('time-display').innerText = `${m}:${s}`;
      }, 1000);

      playSound('deal');
      render();
    }

    function drawStock() {
      if (isAutoCompleting) return;
      if (stock.length > 0) {
        saveState();
        const card = stock.pop();
        card.faceUp = true;
        waste.push(card);
        playSound('deal');
      } else if (waste.length > 0) {
        saveState();
        stock = waste.reverse().map(c => { c.faceUp = false; return c; });
        waste = [];
        playSound('deal');
      }
      render();
    }

    // 本格的ピップ・肖像画レンダリングエンジン
    function renderCardInner(card) {
      const rankStr = RANK_LABELS[card.rank] || card.rank;
      const colorClass = card.color === 'red' ? 'suit-red' : 'suit-black';
      const icon = SUIT_ICONS[card.suit];

      // コーナーインデックス
      const cornerTop = `
        <div class="absolute top-1 left-1.5 flex flex-col items-center leading-none pointer-events-none ${colorClass}">
          <span class="text-[12px] sm:text-[13px] font-black font-card tracking-tighter">${rankStr}</span>
          <span class="text-[10px] sm:text-[11px] mt-0.5">${icon}</span>
        </div>
      `;
      const cornerBottom = `
        <div class="absolute bottom-1 right-1.5 flex flex-col items-center leading-none rotate-180 pointer-events-none ${colorClass}">
          <span class="text-[12px] sm:text-[13px] font-black font-card tracking-tighter">${rankStr}</span>
          <span class="text-[10px] sm:text-[11px] mt-0.5">${icon}</span>
        </div>
      `;

      let centerHTML = '';

      // 1. エース (A) - スペードは伝統的大判オーナメント
      if (card.rank === 1) {
        if (card.suit === 'spade') {
          centerHTML = `
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none ${colorClass}">
              <div class="relative flex items-center justify-center">
                <span class="text-4xl sm:text-5xl drop-shadow-sm">♠</span>
                <span class="absolute text-[8px] font-card font-bold tracking-widest text-slate-500 mt-7">ACE</span>
              </div>
            </div>
          `;
        } else {
          centerHTML = `
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none ${colorClass}">
              <span class="text-3xl sm:text-4xl">${icon}</span>
            </div>
          `;
        }
      }
      // 2. 絵札 (J, Q, K) - トランプ伝統のダブルヘッド肖像アート
      else if (card.rank >= 11) {
        let badge = card.rank === 11 ? 'JACK' : (card.rank === 12 ? 'QUEEN' : 'KING');
        let symbol = card.rank === 11 ? '⚔️' : (card.rank === 12 ? '👑' : '♚');
        centerHTML = `
          <div class="absolute inset-x-3 inset-y-2 flex flex-col items-center justify-between border border-slate-300 rounded pointer-events-none bg-slate-50/50 py-1 ${colorClass}">
            <div class="text-[9px] font-bold font-card tracking-wider opacity-80">${badge}</div>
            <div class="text-xl sm:text-2xl">${symbol}</div>
            <div class="text-xs opacity-60">${icon}</div>
            <div class="w-full border-t border-slate-300/80 my-0.5"></div>
            <div class="text-xs opacity-60 rotate-180">${icon}</div>
            <div class="text-xl sm:text-2xl rotate-180">${symbol}</div>
            <div class="text-[9px] font-bold font-card tracking-wider opacity-80 rotate-180">${badge}</div>
          </div>
        `;
      }
      // 3. 数字札 (2〜10) - 実物のトランプと同じ正式なピップ配置
      else {
        let pips = '';
        const r = card.rank;
        const addPip = (col, row, rotate = false) => {
          const rotClass = rotate ? 'rotate' : '';
          return `<span class="pip ${rotClass}" style="grid-column:${col}; grid-row:${row}">${icon}</span>`;
        };

        if (r === 2) {
          pips += addPip(2, 1) + addPip(2, 5, true);
        } else if (r === 3) {
          pips += addPip(2, 1) + addPip(2, 3) + addPip(2, 5, true);
        } else if (r === 4) {
          pips += addPip(1, 1) + addPip(3, 1) + addPip(1, 5, true) + addPip(3, 5, true);
        } else if (r === 5) {
          pips += addPip(1, 1) + addPip(3, 1) + addPip(2, 3) + addPip(1, 5, true) + addPip(3, 5, true);
        } else if (r === 6) {
          pips += addPip(1, 1) + addPip(3, 1) + addPip(1, 3) + addPip(3, 3) + addPip(1, 5, true) + addPip(3, 5, true);
        } else if (r === 7) {
          pips += addPip(1, 1) + addPip(3, 1) + addPip(2, 2) + addPip(1, 3) + addPip(3, 3) + addPip(1, 5, true) + addPip(3, 5, true);
        } else if (r === 8) {
          pips += addPip(1, 1) + addPip(3, 1) + addPip(2, 2) + addPip(1, 3) + addPip(3, 3) + addPip(2, 4, true) + addPip(1, 5, true) + addPip(3, 5, true);
        } else if (r === 9) {
          pips += addPip(1, 1) + addPip(3, 1) + addPip(1, 2) + addPip(3, 2) + addPip(2, 3) + addPip(1, 4, true) + addPip(3, 4, true) + addPip(1, 5, true) + addPip(3, 5, true);
        } else if (r === 10) {
          pips += addPip(1, 1) + addPip(3, 1) + addPip(2, 2) + addPip(1, 2) + addPip(3, 2) + addPip(1, 4, true) + addPip(3, 4, true) + addPip(2, 4, true) + addPip(1, 5, true) + addPip(3, 5, true);
        }

        centerHTML = `
          <div class="pips-grid ${colorClass}" style="grid-template-rows: repeat(5, 1fr);">
            ${pips}
          </div>
        `;
      }

      return `${cornerTop}${centerHTML}${cornerBottom}`;
    }

    function createCardElement(card, source, col, row) {
      const el = document.createElement('div');
      el.className = 'playing-card';

      if (!card.faceUp) {
        el.classList.add('card-back');
        el.innerHTML = `
          <div class="card-back-pattern">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border border-amber-300/40 bg-blue-950/80 flex items-center justify-center text-amber-300 text-xs sm:text-sm shadow-md">
              <i class="fa-solid fa-cube"></i>
            </div>
          </div>
        `;
        return el;
      }

      el.classList.add('card-front');
      el.innerHTML = renderCardInner(card);

      // ドラッグ属性
      el.draggable = true;
      el.ondragstart = (e) => handleDragStart(e, source, col, row);

      // タップ・ダブルクリックで自動移動
      el.ondblclick = () => tryAutoMove(card, source, col, row);
      el.onclick = () => tryAutoMove(card, source, col, row);

      return el;
    }

    function render() {
      document.getElementById('score-display').innerText = score;
      document.getElementById('btn-undo').disabled = moveHistory.length === 0;

      // 1. Stock
      const stockSlot = document.getElementById('stock-slot');
      stockSlot.innerHTML = '';
      if (stock.length > 0) {
        const topBack = document.createElement('div');
        topBack.className = 'playing-card card-back';
        topBack.innerHTML = `
          <div class="card-back-pattern">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border border-amber-300/40 bg-blue-950/80 flex items-center justify-center text-amber-300 text-xs sm:text-sm shadow-md">
              <i class="fa-solid fa-cube"></i>
            </div>
          </div>
        `;
        stockSlot.appendChild(topBack);
      } else {
        stockSlot.innerHTML = '<i class="fa-solid fa-rotate-left text-white/30 text-xl"></i>';
      }

      // 2. Waste
      const wasteSlot = document.getElementById('waste-slot');
      wasteSlot.innerHTML = '';
      if (waste.length > 0) {
        const top = waste[waste.length - 1];
        const cardElem = createCardElement(top, 'waste', 0, waste.length - 1);
        wasteSlot.appendChild(cardElem);
      }

      // 3. Foundations
      foundations.forEach((f, idx) => {
        const fSlot = document.getElementById(`foundation-${idx}`);
        fSlot.innerHTML = '';
        if (f.length > 0) {
          const top = f[f.length - 1];
          const cardElem = createCardElement(top, 'foundation', idx, f.length - 1);
          fSlot.appendChild(cardElem);
        } else {
          const suitIcons = ['♠', '♥', '♦', '♣'];
          const suitColor = (idx === 1 || idx === 2) ? 'text-rose-400/25' : 'text-white/20';
          fSlot.innerHTML = `<span class="${suitColor} text-3xl font-bold">${suitIcons[idx]}</span>`;
        }
      });

      // 4. Tableaus (重なり段差)
      tableaus.forEach((t, tIdx) => {
        const tSlot = document.getElementById(`tableau-${tIdx}`);
        tSlot.innerHTML = '';
        let currentOffset = 0;
        t.forEach((card, cIdx) => {
          const cardElem = createCardElement(card, 'tableau', tIdx, cIdx);
          cardElem.style.top = `${currentOffset}px`;
          tSlot.appendChild(cardElem);
          currentOffset += card.faceUp ? 26 : 14;
        });
      });

      checkAutoComplete();
    }

    // ドラッグ＆ドロップ
    let draggedData = null;

    function handleDragStart(e, source, col, row) {
      if (isAutoCompleting) return;
      draggedData = { source, col, row };
      e.dataTransfer.setData('text/plain', JSON.stringify({ source, col, row }));
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    function handleDrop(e, targetType, targetCol) {
      e.preventDefault();
      if (!draggedData || isAutoCompleting) return;

      const { source, col, row } = draggedData;
      let movingCards = [];

      if (source === 'waste') {
        movingCards = [waste[waste.length - 1]];
      } else if (source === 'tableau') {
        movingCards = tableaus[col].slice(row);
      } else if (source === 'foundation') {
        movingCards = [foundations[col][foundations[col].length - 1]];
      }

      if (movingCards.length === 0) return;

      const baseCard = movingCards[0];

      if (targetType === 'foundation') {
        if (movingCards.length === 1 && canPlaceOnFoundation(baseCard, targetCol)) {
          saveState();
          executeMove(source, col, row, 'foundation', targetCol, movingCards);
          score += 10;
          playSound('foundation');
          render();
        }
      } else if (targetType === 'tableau') {
        if (canPlaceOnTableau(baseCard, targetCol)) {
          saveState();
          executeMove(source, col, row, 'tableau', targetCol, movingCards);
          score += 5;
          playSound('place');
          render();
        }
      }
      draggedData = null;
    }

    function canPlaceOnFoundation(card, fIdx) {
      const f = foundations[fIdx];
      const targetSuit = SUITS[fIdx];
      if (card.suit !== targetSuit) return false;
      if (f.length === 0) return card.rank === 1; // Aのみ
      return card.rank === f[f.length - 1].rank + 1;
    }

    function canPlaceOnTableau(card, tIdx) {
      const t = tableaus[tIdx];
      if (t.length === 0) return card.rank === 13; // 空き列はKのみ
      const top = t[t.length - 1];
      if (!top.faceUp) return false;
      return card.color !== top.color && card.rank === top.rank - 1;
    }

    function executeMove(fromType, fromCol, fromRow, toType, toCol, movingCards) {
      if (fromType === 'waste') {
        waste.pop();
      } else if (fromType === 'tableau') {
        tableaus[fromCol].splice(fromRow, movingCards.length);
        if (tableaus[fromCol].length > 0) {
          tableaus[fromCol][tableaus[fromCol].length - 1].faceUp = true;
        }
      } else if (fromType === 'foundation') {
        foundations[fromCol].pop();
      }

      if (toType === 'foundation') {
        foundations[toCol].push(movingCards[0]);
      } else if (toType === 'tableau') {
        tableaus[toCol].push(...movingCards);
      }
    }

    function tryAutoMove(card, source, col, row) {
      if (!card.faceUp || isAutoCompleting) return;

      // 1. 組札へ移動可能か
      for (let fIdx = 0; fIdx < 4; fIdx++) {
        if (canPlaceOnFoundation(card, fIdx)) {
          saveState();
          const moving = source === 'waste' ? [waste[waste.length - 1]] : (source === 'tableau' ? tableaus[col].slice(row) : []);
          if (moving.length === 1) {
            executeMove(source, col, row, 'foundation', fIdx, moving);
            score += 10;
            playSound('foundation');
            render();
            return;
          }
        }
      }

      // 2. 場札へ移動可能か
      if (source !== 'tableau' || row === tableaus[col].length - 1) {
        for (let tIdx = 0; tIdx < 7; tIdx++) {
          if (source === 'tableau' && col === tIdx) continue;
          if (canPlaceOnTableau(card, tIdx)) {
            saveState();
            const moving = source === 'waste' ? [waste[waste.length - 1]] : tableaus[col].slice(row);
            executeMove(source, col, row, 'tableau', tIdx, moving);
            score += 5;
            playSound('place');
            render();
            return;
          }
        }
      }
    }

    // スマートヒント機能（動かす元＝黄色、移動先＝水色）
    function showHint() {
      clearHints();

      // 1. 組札に送れるカード
      for (let i = 0; i < 7; i++) {
        if (tableaus[i].length > 0) {
          const top = tableaus[i][tableaus[i].length - 1];
          for (let f = 0; f < 4; f++) {
            if (canPlaceOnFoundation(top, f)) {
              highlightHint(`#tableau-${i} .playing-card:last-child`, `#foundation-${f}`);
              return;
            }
          }
        }
      }

      if (waste.length > 0) {
        const top = waste[waste.length - 1];
        for (let f = 0; f < 4; f++) {
          if (canPlaceOnFoundation(top, f)) {
            highlightHint('#waste-slot .playing-card', `#foundation-${f}`);
            return;
          }
        }
      }

      // 2. 裏向きカードを開けられる場札移動
      for (let i = 0; i < 7; i++) {
        for (let r = 0; r < tableaus[i].length; r++) {
          const card = tableaus[i][r];
          if (!card.faceUp) continue;
          if (r > 0 && !tableaus[i][r - 1].faceUp) {
            for (let j = 0; j < 7; j++) {
              if (i === j) continue;
              if (canPlaceOnTableau(card, j)) {
                const targetCard = tableaus[j].length > 0 ? `#tableau-${j} .playing-card:last-child` : `#tableau-${j}`;
                highlightHint(`#tableau-${i} .playing-card:nth-child(${r + 1})`, targetCard);
                return;
              }
            }
          }
        }
      }

      // 3. 捨て札からの場札展開
      if (waste.length > 0) {
        const top = waste[waste.length - 1];
        for (let j = 0; j < 7; j++) {
          if (canPlaceOnTableau(top, j)) {
            const targetCard = tableaus[j].length > 0 ? `#tableau-${j} .playing-card:last-child` : `#tableau-${j}`;
            highlightHint('#waste-slot .playing-card', targetCard);
            return;
          }
        }
      }

      // 4. 山札
      if (stock.length > 0 || waste.length > 0) {
        highlightHint('#stock-slot', null);
      }
    }

    function highlightHint(sourceSel, targetSel) {
      const src = document.querySelector(sourceSel);
      if (src) src.classList.add('hint-source');
      if (targetSel) {
        const tgt = document.querySelector(targetSel);
        if (tgt) tgt.classList.add('hint-target');
      }
      setTimeout(clearHints, 1500);
    }

    function clearHints() {
      document.querySelectorAll('.hint-source').forEach(el => el.classList.remove('hint-source'));
      document.querySelectorAll('.hint-target').forEach(el => el.classList.remove('hint-target'));
    }

    function saveState() {
      moveHistory.push(JSON.stringify({
        stock, waste, foundations, tableaus, score
      }));
    }

    function undoMove() {
      if (moveHistory.length === 0 || isAutoCompleting) return;
      const prev = JSON.parse(moveHistory.pop());
      stock = prev.stock;
      waste = prev.waste;
      foundations = prev.foundations;
      tableaus = prev.tableaus;
      score = prev.score;
      render();
    }

    // オートコンプリート（全カード表向きで自動回収）
    function checkAutoComplete() {
      const totalInFoundation = foundations.reduce((acc, f) => acc + f.length, 0);
      if (totalInFoundation === 52) {
        showWinModal();
        return;
      }

      if (isAutoCompleting) return;

      const hasHiddenCards = tableaus.some(col => col.some(c => !c.faceUp));
      if (!hasHiddenCards && stock.length === 0 && waste.length === 0) {
        isAutoCompleting = true;
        runAutoComplete();
      }
    }

    function runAutoComplete() {
      let moved = false;
      for (let i = 0; i < 7; i++) {
        if (tableaus[i].length > 0) {
          const top = tableaus[i][tableaus[i].length - 1];
          for (let f = 0; f < 4; f++) {
            if (canPlaceOnFoundation(top, f)) {
              executeMove('tableau', i, tableaus[i].length - 1, 'foundation', f, [top]);
              score += 10;
              playSound('foundation');
              render();
              moved = true;
              break;
            }
          }
        }
        if (moved) break;
      }

      if (moved) {
        setTimeout(runAutoComplete, 75);
      } else {
        isAutoCompleting = false;
      }
    }

    function showWinModal() {
      clearInterval(timerInterval);
      document.getElementById('win-time').innerText = document.getElementById('time-display').innerText;
      document.getElementById('win-score').innerText = score;
      document.getElementById('win-modal').classList.remove('hidden');
      document.getElementById('win-modal').classList.add('flex');
      if (window.confetti) {
        window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
    }

    window.onload = () => {
      newGame();
    };
  </script>
</body>
