<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Klondike Solitaire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* どのブラウザ・WebKitでも100%ポインタが消えない安全な標準カーソル定義 */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #14532d; /* カジノ・フェルトグリーン */
      background-image: radial-gradient(#15803d 15%, #14532d 85%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: default !important;
    }

    button, a, .clickable {
      cursor: pointer !important;
    }

    /* トランプカードのスタイル */
    .card-slot {
      aspect-ratio: 5 / 7;
      border-radius: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      position: relative;
    }

    .playing-card {
      aspect-ratio: 5 / 7;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer !important;
    }

    .playing-card[draggable="true"] {
      cursor: grab !important;
    }

    .playing-card:active {
      cursor: grabbing !important;
    }

    .playing-card.dragging {
      opacity: 0.85;
      transform: scale(1.05);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      z-index: 9999 !important;
    }

    .playing-card.hint-active {
      box-shadow: 0 0 0 3px #facc15, 0 0 15px #facc15 !important;
    }

    /* 裏面デザイン */
    .card-back {
      background: linear-gradient(135deg, #1e3a8a 25%, #1e40af 25%, #1e40af 50%, #1e3a8a 50%, #1e3a8a 75%, #1e40af 75%, #1e40af 100%);
      background-size: 14px 14px;
      border: 2px solid #ffffff;
      border-radius: 8px;
      cursor: default !important;
    }

    /* 表の赤・黒 */
    .suit-red { color: #dc2626; }
    .suit-black { color: #0f172a; }

    /* 紙吹雪演出 */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-black/30 backdrop-blur-md border-b border-white/10 px-4 py-2.5 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="../" class="text-xs font-bold text-white/70 hover:text-white bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> Apps Hub
        </a>
        <h1 class="text-sm font-bold text-white flex items-center gap-1.5">
          <i class="fa-solid fa-clone text-rose-400"></i> ソリティア
        </h1>
      </div>
      <div class="flex items-center gap-3 text-xs font-mono">
        <div class="bg-black/40 px-3 py-1 rounded-md border border-white/10">
          <span class="text-white/60">TIME:</span> <span id="time-display" class="font-bold">00:00</span>
        </div>
        <div class="bg-black/40 px-3 py-1 rounded-md border border-white/10">
          <span class="text-white/60">SCORE:</span> <span id="score-display" class="font-bold text-amber-300">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="max-w-4xl mx-auto w-full px-3 py-2 flex items-center justify-between gap-2 text-xs">
    <div class="flex gap-2">
      <button onclick="newGame()" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg border border-white/20 transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-rotate-right"></i> 配り直す
      </button>
      <button onclick="showHint()" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg border border-white/20 transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-regular fa-lightbulb text-amber-300"></i> ヒント
      </button>
      <button onclick="undoMove()" id="btn-undo" disabled class="bg-white/10 text-white/40 font-bold px-3 py-1.5 rounded-lg border border-white/10 transition flex items-center gap-1.5 disabled:opacity-40">
        <i class="fa-solid fa-arrow-rotate-left"></i> 待った
      </button>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleSound()" id="sound-btn" class="bg-white/15 hover:bg-white/25 text-white font-bold p-1.5 px-2.5 rounded-lg border border-white/20 transition">
        <i id="sound-icon" class="fa-solid fa-volume-high"></i>
      </button>
    </div>
  </div>

  <!-- Game Board -->
  <main class="max-w-4xl mx-auto w-full px-2 sm:px-4 py-3 flex-1 flex flex-col justify-start">
    
    <!-- Top Row: Stock / Waste / Foundations -->
    <div class="grid grid-cols-7 gap-2 sm:gap-3 mb-6">
      
      <!-- 1: Stock (山札) -->
      <div id="stock-slot" onclick="drawStock()" class="card-slot flex items-center justify-center bg-black/20 hover:border-white/40 transition">
        <i class="fa-solid fa-rotate-left text-white/30 text-xl"></i>
      </div>

      <!-- 2: Waste (捨て札) -->
      <div id="waste-slot" class="card-slot bg-black/10"></div>

      <!-- 3: Spacer -->
      <div class="pointer-events-none"></div>

      <!-- 4-7: Foundations (組札 ♠ ♥ ♦ ♣) -->
      <div id="foundation-0" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 0)" class="card-slot flex items-center justify-center bg-black/15">
        <span class="text-white/20 text-2xl font-bold">♠</span>
      </div>
      <div id="foundation-1" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 1)" class="card-slot flex items-center justify-center bg-black/15">
        <span class="text-white/20 text-2xl font-bold">♥</span>
      </div>
      <div id="foundation-2" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 2)" class="card-slot flex items-center justify-center bg-black/15">
        <span class="text-white/20 text-2xl font-bold">♦</span>
      </div>
      <div id="foundation-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'foundation', 3)" class="card-slot flex items-center justify-center bg-black/15">
        <span class="text-white/20 text-2xl font-bold">♣</span>
      </div>

    </div>

    <!-- Bottom Row: 7 Tableaus (場札) -->
    <div class="grid grid-cols-7 gap-2 sm:gap-3 flex-1 min-h-[360px]">
      <div id="tableau-0" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 0)" class="card-slot bg-black/10"></div>
      <div id="tableau-1" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 1)" class="card-slot bg-black/10"></div>
      <div id="tableau-2" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 2)" class="card-slot bg-black/10"></div>
      <div id="tableau-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 3)" class="card-slot bg-black/10"></div>
      <div id="tableau-4" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 4)" class="card-slot bg-black/10"></div>
      <div id="tableau-5" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 5)" class="card-slot bg-black/10"></div>
      <div id="tableau-6" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'tableau', 6)" class="card-slot bg-black/10"></div>
    </div>

  </main>

  <!-- Clear Modal -->
  <div id="win-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex-col items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-700 p-6 sm:p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl relative">
      <div class="w-16 h-16 rounded-2xl bg-amber-400/20 text-amber-400 flex items-center justify-center text-3xl mx-auto mb-4 border border-amber-400/30">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 class="text-2xl font-black text-white mb-1">CONGRATULATIONS!</h2>
      <p class="text-sm text-slate-400 mb-6">見事にクロンダイクをクリアしました！</p>
      <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 mb-6 text-xs flex justify-around font-mono">
        <div><span class="text-slate-400">TIME:</span> <span id="win-time" class="font-bold text-white">00:00</span></div>
        <div><span class="text-slate-400">SCORE:</span> <span id="win-score" class="font-bold text-amber-300">0</span></div>
      </div>
      <button onclick="newGame()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-white shadow-lg transition active:scale-95">
        もう一度遊ぶ
      </button>
    </div>
  </div>

  <footer class="py-3 text-center text-[11px] text-white/40">
    ※個人開発プロトタイプにつき無保証・自己責任にてご利用ください（Apps Hub）
  </footer>

  <script>
    const SUITS = ['spade', 'heart', 'diamond', 'club'];
    const SUIT_ICONS = { spade: '♠', heart: '♥', diamond: '♦', club: '♣' };
    const SUIT_COLORS = { spade: 'black', heart: 'red', diamond: 'red', club: 'black' };
    const RANK_LABELS = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };

    let stock = [];
    let waste = [];
    let foundations = [[], [], [], []];
    let tableaus = [[], [], [], [], [], [], []];
    let moveHistory = [];

    let score = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let soundEnabled = true;

    // Web Audio Synthesizer
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const actx = getAudioCtx();
        const now = actx.currentTime;
        const osc = actx.createOscillator();
        const gain = actx.createGain();

        if (type === 'deal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'place') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.07);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(now); osc.stop(now + 0.07);
        } else if (type === 'foundation') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(now); osc.stop(now + 0.12);
        }
      } catch (e) {}
    }

    function createDeck() {
      const deck = [];
      SUITS.forEach(suit => {
        for (let r = 1; r <= 13; r++) {
          deck.push({
            suit: suit,
            rank: r,
            faceUp: false,
            color: SUIT_COLORS[suit]
          });
        }
      });
      // Fisher-Yates シャッフル
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function newGame() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      score = 0;
      moveHistory = [];
      document.getElementById('win-modal').classList.add('hidden');
      document.getElementById('btn-undo').disabled = true;

      const deck = createDeck();
      stock = [];
      waste = [];
      foundations = [[], [], [], []];
      tableaus = [[], [], [], [], [], [], []];

      // 場札の初期配牌 (1〜7枚)
      for (let i = 0; i < 7; i++) {
        for (let j = 0; j <= i; j++) {
          const card = deck.pop();
          if (j === i) card.faceUp = true;
          tableaus[i].push(card);
        }
      }

      stock = deck;

      timerInterval = setInterval(() => {
        timerSeconds++;
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('time-display').innerText = `${m}:${s}`;
      }, 1000);

      playSound('deal');
      render();
    }

    // 山札を引く
    function drawStock() {
      if (stock.length > 0) {
        saveState();
        const card = stock.pop();
        card.faceUp = true;
        waste.push(card);
        playSound('deal');
      } else if (waste.length > 0) {
        saveState();
        stock = waste.reverse().map(c => { c.faceUp = false; return c; });
        waste = [];
        playSound('deal');
      }
      render();
    }

    // HTML描画
    function render() {
      document.getElementById('score-display').innerText = score;
      document.getElementById('btn-undo').disabled = moveHistory.length === 0;

      // 1. Stock
      const stockSlot = document.getElementById('stock-slot');
      stockSlot.innerHTML = '';
      if (stock.length > 0) {
        const back = document.createElement('div');
        back.className = 'playing-card card-back';
        stockSlot.appendChild(back);
      } else {
        stockSlot.innerHTML = '<i class="fa-solid fa-rotate-left text-white/30 text-xl"></i>';
      }

      // 2. Waste
      const wasteSlot = document.getElementById('waste-slot');
      wasteSlot.innerHTML = '';
      if (waste.length > 0) {
        const top = waste[waste.length - 1];
        const cardElem = createCardElement(top, 'waste', 0, waste.length - 1);
        wasteSlot.appendChild(cardElem);
      }

      // 3. Foundations
      foundations.forEach((f, idx) => {
        const fSlot = document.getElementById(`foundation-${idx}`);
        fSlot.innerHTML = '';
        if (f.length > 0) {
          const top = f[f.length - 1];
          const cardElem = createCardElement(top, 'foundation', idx, f.length - 1);
          fSlot.appendChild(cardElem);
        } else {
          fSlot.innerHTML = `<span class="text-white/20 text-2xl font-bold">${SUIT_ICONS[SUITS[idx]]}</span>`;
        }
      });

      // 4. Tableaus
      tableaus.forEach((t, tIdx) => {
        const tSlot = document.getElementById(`tableau-${tIdx}`);
        tSlot.innerHTML = '';
        t.forEach((card, cIdx) => {
          const cardElem = createCardElement(card, 'tableau', tIdx, cIdx);
          cardElem.style.top = `${cIdx * 20}px`;
          tSlot.appendChild(cardElem);
        });
      });

      checkWinCondition();
    }

    // カードDOMの生成
    function createCardElement(card, source, col, row) {
      const el = document.createElement('div');
      el.className = 'playing-card';

      if (!card.faceUp) {
        el.classList.add('card-back');
        return el;
      }

      const rankStr = RANK_LABELS[card.rank] || card.rank;
      const colorClass = card.color === 'red' ? 'suit-red' : 'suit-black';

      el.innerHTML = `
        <div class="p-1 sm:p-1.5 h-full flex flex-col justify-between ${colorClass}">
          <div class="leading-none text-left">
            <div class="text-[12px] sm:text-xs font-black tracking-tight">${rankStr}</div>
            <div class="text-[10px] sm:text-[11px] leading-tight">${SUIT_ICONS[card.suit]}</div>
          </div>
          <div class="text-center text-lg sm:text-2xl leading-none my-auto">${SUIT_ICONS[card.suit]}</div>
          <div class="leading-none text-right rotate-180">
            <div class="text-[12px] sm:text-xs font-black tracking-tight">${rankStr}</div>
            <div class="text-[10px] sm:text-[11px] leading-tight">${SUIT_ICONS[card.suit]}</div>
          </div>
        </div>
      `;

      // ドラッグ属性
      el.draggable = true;
      el.ondragstart = (e) => handleDragStart(e, source, col, row);

      // タップ・ダブルクリックで自動移動
      el.ondblclick = () => tryAutoMove(card, source, col, row);
      el.onclick = () => tryAutoMove(card, source, col, row);

      return el;
    }

    // ドラッグ＆ドロップ
    let draggedData = null;

    function handleDragStart(e, source, col, row) {
      draggedData = { source, col, row };
      e.dataTransfer.setData('text/plain', JSON.stringify({ source, col, row }));
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    function handleDrop(e, targetType, targetCol) {
      e.preventDefault();
      if (!draggedData) return;

      const { source, col, row } = draggedData;
      let movingCards = [];

      if (source === 'waste') {
        movingCards = [waste[waste.length - 1]];
      } else if (source === 'tableau') {
        movingCards = tableaus[col].slice(row);
      } else if (source === 'foundation') {
        movingCards = [foundations[col][foundations[col].length - 1]];
      }

      if (movingCards.length === 0) return;

      const baseCard = movingCards[0];

      if (targetType === 'foundation') {
        if (movingCards.length === 1 && canPlaceOnFoundation(baseCard, targetCol)) {
          saveState();
          executeMove(source, col, row, 'foundation', targetCol, movingCards);
          score += 10;
          playSound('foundation');
          render();
        }
      } else if (targetType === 'tableau') {
        if (canPlaceOnTableau(baseCard, targetCol)) {
          saveState();
          executeMove(source, col, row, 'tableau', targetCol, movingCards);
          score += 5;
          playSound('place');
          render();
        }
      }
      draggedData = null;
    }

    // 移動可能判定
    function canPlaceOnFoundation(card, fIdx) {
      const f = foundations[fIdx];
      const targetSuit = SUITS[fIdx];
      if (card.suit !== targetSuit) return false;
      if (f.length === 0) return card.rank === 1; // Aのみ
      return card.rank === f[f.length - 1].rank + 1;
    }

    function canPlaceOnTableau(card, tIdx) {
      const t = tableaus[tIdx];
      if (t.length === 0) return card.rank === 13; // 空き列にはKのみ
      const top = t[t.length - 1];
      if (!top.faceUp) return false;
      return card.color !== top.color && card.rank === top.rank - 1;
    }

    function executeMove(fromType, fromCol, fromRow, toType, toCol, movingCards) {
      if (fromType === 'waste') {
        waste.pop();
      } else if (fromType === 'tableau') {
        tableaus[fromCol].splice(fromRow, movingCards.length);
        if (tableaus[fromCol].length > 0) {
          tableaus[fromCol][tableaus[fromCol].length - 1].faceUp = true;
        }
      } else if (fromType === 'foundation') {
        foundations[fromCol].pop();
      }

      if (toType === 'foundation') {
        foundations[toCol].push(movingCards[0]);
      } else if (toType === 'tableau') {
        tableaus[toCol].push(...movingCards);
      }
    }

    // クリック・ダブルクリックによる自動移動（組札へ最優先）
    function tryAutoMove(card, source, col, row) {
      if (!card.faceUp) return;

      // 1. 組札へ移動可能か確認
      for (let fIdx = 0; fIdx < 4; fIdx++) {
        if (canPlaceOnFoundation(card, fIdx)) {
          saveState();
          const moving = source === 'waste' ? [waste[waste.length - 1]] : (source === 'tableau' ? tableaus[col].slice(row) : []);
          if (moving.length === 1) {
            executeMove(source, col, row, 'foundation', fIdx, moving);
            score += 10;
            playSound('foundation');
            render();
            return;
          }
        }
      }

      // 2. 場札へ移動可能か確認
      if (source !== 'tableau' || row === tableaus[col].length - 1) {
        for (let tIdx = 0; tIdx < 7; tIdx++) {
          if (source === 'tableau' && col === tIdx) continue;
          if (canPlaceOnTableau(card, tIdx)) {
            saveState();
            const moving = source === 'waste' ? [waste[waste.length - 1]] : tableaus[col].slice(row);
            executeMove(source, col, row, 'tableau', tIdx, moving);
            score += 5;
            playSound('place');
            render();
            return;
          }
        }
      }
    }

    // ヒント機能
    function showHint() {
      // 1. 組札に送れるカードを探す
      if (waste.length > 0) {
        const top = waste[waste.length - 1];
        for (let f = 0; f < 4; f++) {
          if (canPlaceOnFoundation(top, f)) {
            flashHint('#waste-slot .playing-card');
            return;
          }
        }
      }

      for (let i = 0; i < 7; i++) {
        if (tableaus[i].length > 0) {
          const top = tableaus[i][tableaus[i].length - 1];
          for (let f = 0; f < 4; f++) {
            if (canPlaceOnFoundation(top, f)) {
              flashHint(`#tableau-${i} .playing-card:last-child`);
              return;
            }
          }
        }
      }

      // 2. 場札間で移動できるカードを探す
      for (let i = 0; i < 7; i++) {
        for (let r = 0; r < tableaus[i].length; r++) {
          const card = tableaus[i][r];
          if (!card.faceUp) continue;
          for (let j = 0; j < 7; j++) {
            if (i === j) continue;
            if (canPlaceOnTableau(card, j)) {
              flashHint(`#tableau-${i} .playing-card:nth-child(${r + 1})`);
              return;
            }
          }
        }
      }

      // 3. 山札を促す
      flashHint('#stock-slot');
    }

    function flashHint(selector) {
      const el = document.querySelector(selector);
      if (el) {
        el.classList.add('hint-active');
        setTimeout(() => el.classList.remove('hint-active'), 1200);
      }
    }

    // 待った（アンドゥ）
    function saveState() {
      moveHistory.push(JSON.stringify({
        stock, waste, foundations, tableaus, score
      }));
    }

    function undoMove() {
      if (moveHistory.length === 0) return;
      const prev = JSON.parse(moveHistory.pop());
      stock = prev.stock;
      waste = prev.waste;
      foundations = prev.foundations;
      tableaus = prev.tableaus;
      score = prev.score;
      render();
    }

    // クリア判定
    function checkWinCondition() {
      const totalInFoundation = foundations.reduce((acc, f) => acc + f.length, 0);
      if (totalInFoundation === 52) {
        clearInterval(timerInterval);
        document.getElementById('win-time').innerText = document.getElementById('time-display').innerText;
        document.getElementById('win-score').innerText = score;
        document.getElementById('win-modal').classList.remove('hidden');
        document.getElementById('win-modal').classList.add('flex');
        createConfetti();
      }
    }

    function createConfetti() {
      const colors = ['#f43f5e', '#38bdf8', '#fbbf24', '#34d399', '#a855f7'];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = `${Math.random() * 100}vw`;
        c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = `${2 + Math.random() * 3}s`;
        c.style.animationDelay = `${Math.random() * 1.5}s`;
        document.body.appendChild(c);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
    }

    // 起動
    window.onload = () => {
      newGame();
    };
  </script>
</body>
</html>
